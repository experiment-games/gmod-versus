<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">{{ module.data.settings.header }}</h2>
  </div>

  <div class="panel-body">
    <form action='/module/giftcard_balance'
          method='post'>
      <input type="text"
             autocomplete="off"
             name="card_number"
             placeholder="Enter Code"
             value="{{ module.data.giftCard ? module.data.giftCard.code : '' }}"
             class="w-full p-2 border text-[#dce6f0] border-[--border-color]" />
      <div class="mt-4">
        <button class="btn-vs w-full justify-center">Check Gift Card</button>
      </div>
    </form>
  </div>

  {% if module.data.error %}
  <div class="px-4 py-3 bg-[#d75252] text-white font-['Lexend'] text-sm font-semibold border-t border-[--border-color]">
    <p>{{ module.data.error }}</p>
  </div>
  {% endif %}

  {% if module.data.giftCard %}
  <div class="px-4 py-3 bg-[#52d787] text-white font-['Lexend'] text-sm font-semibold border-t border-[--border-color]">
    <p>Your gift card balance is <b>{{ module.data.giftCard.balance|money_store_currency }}</b>.</p>
  </div>
  {% endif %}
</div>
